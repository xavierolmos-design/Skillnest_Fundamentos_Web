<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio arreglos</title>
    <meta name="author" content="Xavier">

    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Arreglos / listas / array</h1>
        <div class="card">
            <h2>Arreglo</h2>
            <p>Manipular arreglo</p>
            <button onclick="manipularArreglo()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Edad</h2>
            <p>Edades</p>
            <button onclick="Edades()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Nombres</h2>
            <p>Nombres alumnos</p>
            <button onclick="Alumnos()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Puntos en un videojuego</h2>
            <p>Calcula el total de puntos después de 5 niveles.</p>
            <button onclick="puntosJuegos()">Iniciar simulación</button>
        </div>
        <div class="card">
            <h2>Contador de notificaciones</h2>
            <p>Simula un contador de notificaciones pendientes.</p>
            <button onclick="contadorNotificaciones()">Iniciar simulación</button>
        </div>
    </div>
    <script src="static/js/script.js"></script>

</body>

</html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bucles en java script</title>

    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>

    <div class="contenedor">

        <h1>Práctica de bucles</h1>

        <div class="card">
            <h2>Ejemplo numero 1</h2>
            <p>Calculadora de envío.</p>
            <button onclick="contarhastados()">Ejecutar</button>
        </div>

        <div class="card">
            <h2>Ejemplo numero 2</h2>
            <p>Cuenta regresiva.</p>
            <button onclick="cuentaRegresiva()">Ejecutar</button>
        </div>

        <div class="card">
            <h2>Ejemplo numero 3</h2>
            <p>Lista</p>
            <button onclick="recorrerLista()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo while 1</h2>
            <p>Reproducción de canción.</p>
            <button onclick="reproducirCancion()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo while 2</h2>
            <p>Carga de datos.</p>
            <button onclick="cargarDatos()">Ejecutar</button>
        </div>
        <div class="card">
            <h2>Ejemplo while 3</h2>
            <p>Validación de contraseña.</p>
            <button onclick="validarcontrasena()">Ejecutar</button>
        </div>
    </div>

    <script src="static/js/script.js"></script>
